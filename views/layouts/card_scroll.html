{{ define "card_scroll" }}
<div class="z-30 flex items-start max-md:flex-col">
    <div class="self-stretch flex-1 max-md:pt-4">
        <div class="flex w-full flex-1 flex-col gap-4 rounded-xl inset-shadow-sm 
                    max-h-[calc(100svh-16rem)]
                    sm:max-h-[calc(100svh-16rem)] 
                    md:max-h-[calc(100svh-10rem)] 
                    lg:max-h-[calc(100svh-10rem)] 
                    2xl:max-h-[calc(100svh-10rem)] 
                    relative">
            <div class="flex-1 h-full p-4 overflow-x-hidden overflow-y-auto border rounded-xl 
                        border-neutral-200 dark:border-base-200 bg-base-100">
                <div class="w-full max-w-full">
                    {{ template "slot" . }}
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
